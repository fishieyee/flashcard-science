<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSLE Science Flashcards</title>

<!-- Google Fonts: Poppins (concept header) + Inter (body text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     THEME — Warm, muted, pastel-based for reduced eye strain
     Charcoal text (never pure black) on soft pastel backgrounds
     ============================================================ */
  /* ============================================================
     TYPOGRAPHY SYSTEM
     --font-head: Poppins (concept header — geometric, wide, bold)
     --font-body: Inter (explanation — tall x-height, highly readable)
     ============================================================ */
  :root {
    --font-head: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

    /* Base */
    --bg: #F7F5F0;              /* warm off-white canvas */
    --text: #3A3530;            /* charcoal — never pure black */
    --text-muted: #8C8480;      /* muted warm grey */
    --border: #E2DDD5;          /* soft warm border */
    --radius: 14px;

    /* Topic palettes — each has bg, badge-bg, badge-text, accent, front-bg, back-bg, back-border */
    --Cycles-bg: #D6E8F4;       /* Soft Blue */
    --Cycles-badge-bg: #B8D4E8;
    --Cycles-badge-text: #2B5C80;
    --Cycles-accent: #4A90C4;
    --Cycles-front: #EAF2F9;
    --Cycles-back: #F0F6FB;
    --Cycles-border: #C4DCEC;

    --Systems-bg: #E8E0D0;      /* Warm Beige */
    --Systems-badge-bg: #D9CFB8;
    --Systems-badge-text: #6B5D44;
    --Systems-accent: #A0895E;
    --Systems-front: #F2EBDE;
    --Systems-back: #F7F1E6;
    --Systems-border: #E0D5C0;

    --Interactions-bg: #F5DCE0; /* Soft Pink / Peach */
    --Interactions-badge-bg: #E8C5CC;
    --Interactions-badge-text: #8B3A48;
    --Interactions-accent: #C4707E;
    --Interactions-front: #FAEBEE;
    --Interactions-back: #FBF0F2;
    --Interactions-border: #ECD0D5;

    --Diversity-bg: #D5E8D8;    /* Mint Green */
    --Diversity-badge-bg: #B8D9BD;
    --Diversity-badge-text: #2D5E35;
    --Diversity-accent: #5BA064;
    --Diversity-front: #EAF5EC;
    --Diversity-back: #F0F7F1;
    --Diversity-border: #C8DEC9;

    --Energy-bg: #F0E8D8;       /* Golden Yellow (warm, muted) */
    --Energy-badge-bg: #E0D4B8;
    --Energy-badge-text: #6B5520;
    --Energy-accent: #B8985E;
    --Energy-front: #F7F0E0;
    --Energy-back: #FAF5EA;
    --Energy-border: #EBDCC0;

    /* MOE keyword highlight — bold inline within answer text */
    --kw-bg: #FFF3D6;
    --kw-text: #7A5C10;
    --kw-border: #E8D490;

    /* Shadows — soft, warm-toned */
    --shadow: 0 3px 8px -2px rgba(58,53,48,0.12), 0 2px 4px -1px rgba(58,53,48,0.06);
    --shadow-lg: 0 8px 20px -4px rgba(58,53,48,0.15), 0 4px 8px -2px rgba(58,53,48,0.08);

    --keyword-tag-bg: #FDF6E3;
    --keyword-tag-text: #6B5520;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     HEADER — warm gradient using topic tones
     ============================================================ */
  header {
    background: linear-gradient(135deg, #D6E8F4 0%, #D5E8D8 25%, #F0E8D8 50%, #F5DCE0 75%, #E8E0D0 100%);
    color: var(--text);
    padding: 32px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #4A4038;
  }
  header p {
    font-family: var(--font-body);
    font-size: 0.92rem;
    margin-top: 8px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* ============================================================
     FILTER BAR
     ============================================================ */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 16px 20px;
    background: #FAF8F4;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(58,53,48,0.06);
  }
  .filter-btn {
    padding: 8px 16px;
    border: 2px solid var(--border);
    border-radius: 999px;
    background: white;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .filter-btn.active { color: white; border-color: transparent; }
  .filter-btn[data-topic="All"].active { background: #8C8480; }
  .filter-btn[data-topic="Cycles"].active { background: var(--Cycles-accent); }
  .filter-btn[data-topic="Systems"].active { background: var(--Systems-accent); }
  .filter-btn[data-topic="Interactions"].active { background: var(--Interactions-accent); }
  .filter-btn[data-topic="Diversity"].active { background: var(--Diversity-accent); }
  .filter-btn[data-topic="Energy"].active { background: var(--Energy-accent); }

  .filter-btn .count {
    background: rgba(0,0,0,0.06);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 0.74rem;
  }
  .filter-btn.active .count { background: rgba(255,255,255,0.3); }

  /* ============================================================
     CONTROLS BAR
     ============================================================ */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 24px;
    background: #FAF8F4;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .progress-text { font-family: var(--font-body); font-size: 0.84rem; color: var(--text-muted); font-weight: 600; }
  .action-btns { display: flex; gap: 8px; }
  .action-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
    color: var(--text);
  }
  .action-btn:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .action-btn.flip-all { background: #F0F6FB; color: #2B5C80; border-color: #C4DCEC; }
  .action-btn.shuffle { background: #FAEBEE; color: #8B3A48; border-color: #ECD0D5; }

  /* ============================================================
     CARDS GRID
     ============================================================ */
  .cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
    gap: 24px;
    padding: 28px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ============================================================
     FLASHCARD — 3D flip
     ============================================================ */
  .flashcard {
    perspective: 1000px;
    height: 360px;
    cursor: pointer;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: none;
  }

  /* ============================================================
     CARD FRONT — Question side (Concept Header)
     Poppins Bold, centered, large — dominates the card
     Minimal borders, generous negative space
     ============================================================ */
  .card-front {
    background: white;
    border-top: none;
  }

  /* Topic-specific front backgrounds (no border decorations) */
  .card-front.t-Cycles { background: var(--Cycles-front); }
  .card-front.t-Systems { background: var(--Systems-front); }
  .card-front.t-Interactions { background: var(--Interactions-front); }
  .card-front.t-Diversity { background: var(--Diversity-front); }
  .card-front.t-Energy { background: var(--Energy-front); }

  .card-front .topic-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0;
    width: fit-content;
    align-self: center;
  }
  .card-front .card-num {
    position: absolute;
    top: 16px;
    right: 20px;
    font-family: var(--font-body);
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text-muted);
    opacity: 0.35;
  }
  .card-front .question-label {
    font-family: var(--font-body);
    font-size: 0.66rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 0;
    color: var(--text-muted);
    text-align: center;
    opacity: 0.6;
  }
  .card-front .question-text {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px 8px;
  }
  .card-front .visual-cue {
    margin-top: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card-front .hint {
    margin-top: auto;
    font-family: var(--font-body);
    font-size: 0.74rem;
    color: var(--text-muted);
    text-align: center;
    padding-top: 10px;
    font-weight: 400;
    opacity: 0.55;
  }

  /* Topic badge colors */
  .badge-Cycles { background: var(--Cycles-badge-bg); color: var(--Cycles-badge-text); }
  .badge-Systems { background: var(--Systems-badge-bg); color: var(--Systems-badge-text); }
  .badge-Interactions { background: var(--Interactions-badge-bg); color: var(--Interactions-badge-text); }
  .badge-Diversity { background: var(--Diversity-badge-bg); color: var(--Diversity-badge-text); }
  .badge-Energy { background: var(--Energy-badge-bg); color: var(--Energy-badge-text); }

  /* ============================================================
     CARD BACK — Answer side (Explanation Body)
     Inter font, smaller than header, highly readable
     MOE keywords: bold weight only — no background, no italics
     Clean negative space, minimal borders
     ============================================================ */
  .card-back {
    transform: rotateY(180deg);
    border-top: none;
  }
  .card-back.t-Cycles { background: var(--Cycles-back); }
  .card-back.t-Systems { background: var(--Systems-back); }
  .card-back.t-Interactions { background: var(--Interactions-back); }
  .card-back.t-Diversity { background: var(--Diversity-back); }
  .card-back.t-Energy { background: var(--Energy-back); }

  .card-back .answer-label {
    font-family: var(--font-body);
    font-size: 0.66rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 10px;
    color: var(--text-muted);
    opacity: 0.6;
  }
  .card-back .answer-text {
    font-family: var(--font-body);
    font-size: 0.92rem;
    font-weight: 400;
    line-height: 1.7;
    color: var(--text);
    flex-grow: 1;
    overflow-y: auto;
  }
  /* Bullet points in answer */
  .card-back .answer-text ul {
    list-style: none;
    padding-left: 0;
    margin: 4px 0;
  }
  .card-back .answer-text ul li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 7px;
    line-height: 1.6;
    font-weight: 400;
  }
  .card-back .answer-text ul li::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.35;
  }

  /* MOE keyword — BOLD ONLY, no background, no border, no italics
     Same body font (Inter), just heavier weight to draw the eye */
  .kw {
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--text);
    font-style: normal;
  }

  .card-back .diagram {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Keywords summary section — minimal, clean */
  .card-back .keywords-section {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .card-back .keywords-label {
    font-family: var(--font-body);
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    opacity: 0.5;
  }
  .card-back .keyword-tag {
    display: inline-block;
    background: transparent;
    color: var(--text);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 700;
    margin: 2px 2px;
    border: none;
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.8rem;
    line-height: 1.6;
  }
  footer .kw-demo {
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--text);
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 640px) {
    .cards-container { grid-template-columns: 1fr; padding: 16px; }
    .flashcard { height: 320px; }
    header h1 { font-size: 1.4rem; }
    .filter-btn { font-size: 0.78rem; padding: 6px 12px; }
    .card-front .question-text { font-size: 1.25rem; }
  }

  /* Card load animation */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .flashcard { animation: fadeInUp 0.4s ease forwards; opacity: 0; }

  /* Custom scrollbar for answer text */
  .answer-text::-webkit-scrollbar { width: 4px; }
  .answer-text::-webkit-scrollbar-track { background: transparent; }
  .answer-text::-webkit-scrollbar-thumb { background: rgba(140,132,128,0.3); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>PSLE Science Flashcards</h1>
  <p>Cycles &middot; Systems &middot; Interactions &middot; Diversity &middot; Energy</p>
</header>

<nav class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-topic="All">All <span class="count" id="count-All">0</span></button>
  <button class="filter-btn" data-topic="Cycles">Cycles <span class="count" id="count-Cycles">0</span></button>
  <button class="filter-btn" data-topic="Systems">Systems <span class="count" id="count-Systems">0</span></button>
  <button class="filter-btn" data-topic="Interactions">Interactions <span class="count" id="count-Interactions">0</span></button>
  <button class="filter-btn" data-topic="Diversity">Diversity <span class="count" id="count-Diversity">0</span></button>
  <button class="filter-btn" data-topic="Energy">Energy <span class="count" id="count-Energy">0</span></button>
</nav>

<div class="controls">
  <span class="progress-text" id="progressText">Showing all flashcards</span>
  <div class="action-btns">
    <button class="action-btn flip-all" id="flipAllBtn">Flip All</button>
    <button class="action-btn shuffle" id="shuffleBtn">Shuffle</button>
  </div>
</div>

<main class="cards-container" id="cardsContainer"></main>

<footer>
  <p>Tap any card to flip. <span class="kw-demo">Bold</span> text = crucial MOE marking keywords for full marks.</p>
  <p style="margin-top:4px;">Organized by topic for daily 10-minute review sessions.</p>
</footer>

<script>
// ============================================================
// PSLE SCIENCE FLASHCARD DATA
// Topics: Cycles (Soft Blue), Systems (Warm Beige),
//   Interactions (Soft Pink), Diversity (Mint Green), Energy (Golden Yellow)
// Answers use bullet points with MOE keywords bolded inline
// ============================================================

const flashcardData = [

// ========================== CYCLES (Soft Blue) ==========================
{
  topic: "Cycles",
  q: "What process allows plants to make their own food?",
  a: `<ul>
    <li>The process is <span class="kw">photosynthesis</span>.</li>
    <li>Plants use <span class="kw">light energy</span> from the Sun, <span class="kw">carbon dioxide</span> from the air, and <span class="kw">water</span> from the soil.</li>
    <li><span class="kw">Chlorophyll</span> in the leaves traps <span class="kw">light energy</span> to carry out the process.</li>
    <li>The products are <span class="kw">glucose (sugar)</span> and <span class="kw">oxygen</span>.</li>
  </ul>`,
  keywords: ["photosynthesis", "light energy", "carbon dioxide", "water", "chlorophyll", "glucose", "oxygen"],
  diagram: "photosynthesis"
},
{
  topic: "Cycles",
  q: "What is the water cycle? Name its four main processes.",
  a: `<ul>
    <li>The water cycle is the <span class="kw">continuous movement of water</span> between the Earth's surface and the atmosphere.</li>
    <li><span class="kw">Evaporation</span> — water gains heat and turns into <span class="kw">water vapour</span>.</li>
    <li><span class="kw">Condensation</span> — water vapour loses heat and forms clouds.</li>
    <li><span class="kw">Precipitation</span> — rain/snow falls from clouds.</li>
    <li><span class="kw">Collection</span> — water flows back into rivers, lakes and seas.</li>
  </ul>`,
  keywords: ["evaporation", "condensation", "precipitation", "collection", "water vapour", "gains heat", "loses heat"],
  diagram: "watercycle"
},
{
  topic: "Cycles",
  q: "Why is the water cycle important?",
  a: `<ul>
    <li>Ensures a <span class="kw">continuous supply</span> of fresh water on Earth.</li>
    <li><span class="kw">Distributes water</span> to different areas, including land far from seas.</li>
    <li><span class="kw">Regulates temperature</span> through evaporation (cooling) and condensation (warming).</li>
    <li><span class="kw">Sustains life</span> — plants, animals and humans all depend on it.</li>
  </ul>`,
  keywords: ["continuous supply", "distributes water", "regulates temperature", "sustains life"]
},
{
  topic: "Cycles",
  q: "What are the four stages of a butterfly's life cycle?",
  a: `<ul>
    <li>The butterfly goes through <span class="kw">complete metamorphosis</span> with four stages:</li>
    <li><span class="kw">Egg</span> &rarr; <span class="kw">Larva (caterpillar)</span> &rarr; <span class="kw">Pupa (chrysalis)</span> &rarr; <span class="kw">Adult butterfly</span>.</li>
    <li>The young looks <span class="kw">very different</span> from the adult.</li>
  </ul>`,
  keywords: ["complete metamorphosis", "egg", "larva", "pupa", "adult", "very different"],
  diagram: "butterfly"
},
{
  topic: "Cycles",
  q: "What is the difference between complete and incomplete metamorphosis?",
  a: `<ul>
    <li><b>Complete metamorphosis</b> (e.g. butterfly, mosquito): four stages &mdash; <span class="kw">egg &rarr; larva &rarr; pupa &rarr; adult</span>. The young looks completely different from the adult.</li>
    <li><b>Incomplete metamorphosis</b> (e.g. grasshopper, cockroach): three stages &mdash; <span class="kw">egg &rarr; nymph &rarr; adult</span>. The nymph <span class="kw">resembles</span> the adult but is smaller and has no wings.</li>
  </ul>`,
  keywords: ["complete metamorphosis", "incomplete metamorphosis", "larva", "pupa", "nymph", "resembles"]
},
{
  topic: "Cycles",
  q: "What are the stages of the human life cycle?",
  a: `<ul>
    <li><span class="kw">Foetus</span> (in the mother's womb) &rarr;</li>
    <li><span class="kw">Infant</span> &rarr; <span class="kw">Child</span> &rarr;</li>
    <li><span class="kw">Adolescent</span> (puberty) &rarr; <span class="kw">Adult</span> &rarr; <span class="kw">Elderly</span>.</li>
    <li>Reproduction occurs in the <span class="kw">adult stage</span>.</li>
  </ul>`,
  keywords: ["foetus", "infant", "child", "adolescent", "puberty", "adult", "elderly"]
},
{
  topic: "Cycles",
  q: "What is pollination and how does it differ from fertilisation?",
  a: `<ul>
    <li><span class="kw">Pollination</span> is the transfer of pollen from the <span class="kw">anther</span> (male part) to the <span class="kw">stigma</span> (female part) of a flower.</li>
    <li>It can be <span class="kw">wind-pollinated</span> or <span class="kw">insect-pollinated</span>.</li>
    <li><span class="kw">Fertilisation</span> is the <span class="kw">fusing</span> of the male reproductive cell with the female reproductive cell in the <span class="kw">ovule</span>, forming a <span class="kw">seed</span>.</li>
  </ul>`,
  keywords: ["pollination", "anther", "stigma", "fertilisation", "fusing", "ovule", "seed"],
  diagram: "flower"
},
{
  topic: "Cycles",
  q: "How are wind-pollinated flowers different from insect-pollinated flowers?",
  a: `<ul>
    <li><b>Insect-pollinated:</b> Large, bright <span class="kw">petals</span>; sweet scent; nectar; <span class="kw">sticky stigma</span>; pollen is sticky/spiky to cling to insects.</li>
    <li><b>Wind-pollinated:</b> Small, dull petals (green/brown); no scent or nectar; <span class="kw">long feathery stigma</span> to catch pollen in the air; large amounts of <span class="kw">light, smooth pollen</span>; <span class="kw">anthers hang outside</span> the flower.</li>
  </ul>`,
  keywords: ["insect-pollinated", "wind-pollinated", "petals", "sticky stigma", "feathery stigma", "anthers hang outside", "light smooth pollen"]
},
{
  topic: "Cycles",
  q: "What causes day and night on Earth?",
  a: `<ul>

    ? currentCards
    : currentCards.filter(c => c.topic === currentFilter);

  if (cards.length === 0) {
    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No flashcards in this topic.</p>';
    return;
  }

  cards.forEach((card, idx) => {
    const globalIdx = flashcardData.indexOf(card);
    const flipClass = allFlipped ? 'flipped' : '';
    const tClass = `t-${card.topic}`;
    const badgeClass = `badge-${card.topic}`;

    const diagramFront = card.diagram ? `<div class="visual-cue">${getDiagram(card.diagram)}</div>` : '';
    const diagramBack = card.diagram ? `<div class="diagram">${getDiagram(card.diagram)}</div>` : '';

    const keywordsHTML = card.keywords
      ? `<div class="keywords-section"><div class="keywords-label">MOE Keywords</div>${card.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('')}</div>`
      : '';

    const html = `
      <div class="flashcard ${flipClass}" data-idx="${globalIdx}" style="animation-delay: ${idx * 0.05}s">
        <div class="flashcard-inner">
          <div class="card-face card-front ${tClass}">
            <span class="card-num">#${globalIdx + 1}</span>
            <span class="topic-badge ${badgeClass}">${card.topic}</span>
            <div class="question-label">Question</div>
            <div class="question-text">${card.q}</div>
            ${diagramFront}
            <div class="hint">Tap to flip and reveal the answer</div>
          </div>
          <div class="card-face card-back ${tClass}">
            <div class="answer-label">Answer</div>
            <div class="answer-text">${card.a}</div>
            ${diagramBack}
            ${keywordsHTML}
          </div>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
  });

  // Update progress text
  document.getElementById('progressText').textContent =
    currentFilter === 'All'
      ? `Showing all ${cards.length} flashcards`
      : `Showing ${cards.length} ${currentFilter} flashcards`;

  // Attach flip handlers
  document.querySelectorAll('.flashcard').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('flipped'));
  });
}

function updateCounts() {
  const topics = ['All', 'Cycles', 'Systems', 'Interactions', 'Diversity', 'Energy'];
  topics.forEach(t => {
    const count = t === 'All'
      ? flashcardData.length
      : flashcardData.filter(c => c.topic === t).length;
    document.getElementById(`count-${t}`).textContent = count;
  });
}

// Filter buttons
document.getElementById('filterBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.topic;
  allFlipped = false;
  document.getElementById('flipAllBtn').textContent = 'Flip All';
  renderCards();
});

// Flip all
document.getElementById('flipAllBtn').addEventListener('click', () => {
  allFlipped = !allFlipped;
  document.querySelectorAll('.flashcard').forEach(el => {
    if (allFlipped) el.classList.add('flipped');
    else el.classList.remove('flipped');
  });
  document.getElementById('flipAllBtn').textContent = allFlipped ? 'Unflip All' : 'Flip All';
});

// Shuffle
document.getElementById('shuffleBtn').addEventListener('click', () => {
  currentCards = [...currentCards].sort(() => Math.random() - 0.5);
  allFlipped = false;
  document.getElementById('flipAllBtn').textContent = 'Flip All';
  renderCards();
});

// Init
updateCounts();
renderCards();
</script>

</body>
</html>
